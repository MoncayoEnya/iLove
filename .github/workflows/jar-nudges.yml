name: Jar inactivity nudges

on:
  schedule:
    - cron: '0 15 * * *' # daily at 15:00 UTC — adjust to whenever suits your users' timezone
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin web-push

      - name: Run jar nudge check
        run: node scripts/send-jar-nudges.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
